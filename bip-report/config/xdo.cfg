<?xml version="1.0" encoding="UTF-8"?>
<!-- BI Publisher engine configuration, loaded by BipReportServer for every render.
     Maps font families used in RTF templates to font files inside the container. -->
<config version="1.0.0" xmlns="http://xmlns.oracle.com/oxp/config/">
  <fonts>
    <!-- Code 128 barcodes (VICS BOL number, PRO number). SIL Open Font License, see fonts/OFL.txt.
         "Default Code 128" is BI Publisher's built-in family name (Template Builder's own
         xdo.cfg maps it to the same Libre Barcode 128 file), so templates preview locally too. -->
    <font family="Default Code 128" style="normal" weight="normal">
      <truetype path="/app/fonts/LibreBarcode128-Regular.ttf"/>
    </font>
    <font family="Libre Barcode 128" style="normal" weight="normal">
      <truetype path="/app/fonts/LibreBarcode128-Regular.ttf"/>
    </font>
  </fonts>
</config>
