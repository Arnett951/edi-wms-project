# Config for pipeline/generate_change_request.py — describes THIS repo so the
# intake tool stays generic and can eventually be pointed at other projects.

project_name: EDI 940 / WMS Integration Dashboard
stack_summary: >
  FastAPI (Python) API + React/Vite dashboard, Azure SQL Database,
  Azure Blob Storage, Azure Data Factory, deployed via GitHub Actions
  to Azure Static Web Apps + App Service.
  Separately, bip-report/ is a BI Publisher report service on a home-lab
  server (Skynet) over IBM Db2 LUW (database TIREWMS, schema WMS). Its
  reports are folders under bip-report/reports/<id>/ (report.json +
  dataset.sql + template.rtf) and the Operational Reporting page lists them
  at runtime, so a new report needs no dashboard or API change. Nothing in
  bip-report/ is deployed by CI: after merge a human copies the folder to
  Skynet. The Db2 tables are NOT in Azure SQL, so list_schema_columns can't
  see them; use grep_repo on bip-report/ SQL files instead (the deployed
  API's grep_repo only sees api/, so there it finds nothing). Rules for
  implementing report CRs: bip-report/CLAUDE.md.

# Lives inside api/ (not repo root) so it deploys with the FastAPI backend --
# .github/workflows/deploy-api-appservice.yml only packages the api/ folder.
output_dir: api/change-requests

tiers:
  A:
    label: In scope — full pipeline
    examples:
      - New SQL view or query
      - New dashboard chart on existing tables
      - New read-only API GET endpoint
      - New BI Publisher report folder in bip-report/reports/ (SELECT-only Db2 SQL + RTF; deployed to Skynet manually after merge)
  B:
    label: Semi-automated — extra reviewer attention at Gate 1
    examples:
      - Additive schema change (new table/column, no drops/renames)
      - New ADF pipeline step
      - New scheduled job
  C:
    label: Excluded — auto-denied, handle manually
    examples:
      - Anything touching auth/security
      - Schema drops or renames
      - New Azure resources or secrets
      - Production data-mutation logic
    # Deterministic backstop -- if any of these show up anywhere in the CR's
    # title/risk_notes/requirements/touch_points/original request, the tier
    # is force-escalated to C regardless of what the model itself classified
    # it as. See change_request_lib.find_forced_tier_c_keyword().
    force_keywords:
      - auth
      - password
      - secret
      - credential
      - token
      - jwt
      - rbac
      - permission
      - role
      - drop table
      - drop column
      - connection string
      - azure resource
      - api key
      - encrypt

cost:
  reference_monthly_budget_usd: 20
  # PLACEHOLDER blended rate — confirm against https://www.anthropic.com/pricing
  # before trusting the dollar figures this tool prints. This is a sizing
  # proxy, not literal billing (actual usage may run through a Pro/Max
  # subscription rather than the metered API).
  blended_rate_per_million_tokens_usd: 6.0
