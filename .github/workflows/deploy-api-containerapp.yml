name: Deploy FastAPI to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api-containerapp.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC federated login -- no stored client secret
  contents: read

env:
  ACR_NAME: ediwmsacrewndrftkul54w
  IMAGE_NAME: edi-wms-api
  RESOURCE_GROUP: rg-azurelab
  CONTAINER_APP: ediwms-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Builds remotely in ACR (no local Docker needed) and tags with the
      # commit SHA -- a floating `:latest` tag silently failed to trigger a
      # fresh pull/new revision once this session (Container Apps only
      # re-pulls when the image reference string itself changes), so every
      # build here gets a genuinely unique tag instead.
      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            --image "$IMAGE_NAME:latest" \
            ./api

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --container-name "$IMAGE_NAME" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

      - name: Verify health
        run: |
          FQDN=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            if curl -sf "https://$FQDN/health" > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after deploy"
          exit 1
