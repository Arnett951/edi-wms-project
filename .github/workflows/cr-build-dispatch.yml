name: CR Build Dispatch

# Triggered remotely by the deployed API (api/main.py's start_build_change_request
# endpoint) when it detects it has no local git repo of its own -- the App
# Service calls the GitHub API to fire this workflow_dispatch instead of
# running Claude Code itself. See pipeline/implement_change_request.py, which
# this just invokes directly (it's already a standalone CLI, unlike Gate 2's
# merge/rollback logic which needed a dedicated gate2_dispatch.py wrapper).
#
# Checkout uses a PAT (secrets.GH_PAT), same reasoning as cr-gate2-dispatch.yml:
# pushes made with the default GITHUB_TOKEN don't trigger other push-based
# workflows and can hit permission issues that a real PAT doesn't.

on:
  workflow_dispatch:
    inputs:
      cr_number:
        description: 'CR number, e.g. 10'
        required: true
      approver:
        description: 'Name of the approver'
        required: false
        default: 'GitHub Actions'
      max_budget_usd:
        description: 'Optional max budget override in USD (blank = auto)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install ODBC Driver 18 for SQL Server
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18

      - run: pip install pyyaml pyodbc python-dotenv

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run implementation
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.max_budget_usd }}" ]; then
            python pipeline/implement_change_request.py "${{ inputs.cr_number }}" --repo . --max-budget-usd "${{ inputs.max_budget_usd }}"
          else
            python pipeline/implement_change_request.py "${{ inputs.cr_number }}" --repo .
          fi

  # If the build job dies before implement_change_request.py gets to handle
  # its own failure (checkout, setup, a crash in the script itself), the CR
  # stays at "Approved (Gate 1) by ..." forever -- the dashboard shows it as
  # implementing and has no button for that status. This sends it back to
  # Pending Build Approval, same as the script's own failure path, so Admin
  # can hit Start Build again once whatever broke is fixed.
  #
  # Deliberately no checkout: a broken checkout is one of the failures this
  # has to cover, so the SQL update is inline rather than via cr_lib. The
  # WHERE clause only touches a CR still at "Approved (Gate 1)" -- if the
  # script already reset it, or got as far as "Implemented", it's left alone.
  mark-failed:
    needs: build
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ODBC Driver 18 for SQL Server
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18

      - run: pip install pyodbc

      - name: Return CR to Pending Build Approval
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          CR_NUMBER: ${{ inputs.cr_number }}
          RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          import os, time, pyodbc

          conn_str = (
              "Driver={ODBC Driver 18 for SQL Server};"
              f"Server=tcp:{os.environ['SQL_SERVER']},1433;"
              f"Database={os.environ['SQL_DATABASE']};"
              f"Uid={os.environ['SQL_USER']};Pwd={os.environ['SQL_PASSWORD']};"
              "Encrypt=yes;TrustServerCertificate=no;Connection Timeout=30;"
          )
          # Azure SQL serverless may be auto-paused (40613) -- same retry
          # as cr_lib.get_conn().
          for attempt in range(6):
              try:
                  conn = pyodbc.connect(conn_str)
                  break
              except pyodbc.Error as exc:
                  if "40613" not in str(exc) or attempt == 5:
                      raise
                  time.sleep(10)

          cr_number = int(os.environ["CR_NUMBER"])
          status = (
              "Pending Build Approval -- previous attempt failed "
              f"(build workflow error, see Actions run {os.environ['RUN_ID']}), retry below"
          )
          cur = conn.cursor()
          cur.execute(
              """
              UPDATE dbo.ChangeRequests
              SET Status = ?, ProgressStatus = 'failed',
                  LastAction = 'Build workflow failed before implementation finished',
                  UpdatedDateTime = sysutcdatetime()
              WHERE CRNumber = ? AND Status LIKE 'Approved (Gate 1)%'
              """,
              status, cr_number,
          )
          conn.commit()
          if cur.rowcount:
              print(f"CR-{cr_number:03d} returned to Pending Build Approval.")
          else:
              print(f"CR-{cr_number:03d} was not at 'Approved (Gate 1)' -- left unchanged.")
